<!DOCTYPE html>
<html>
<head>
    <title>Overcrowded Tank</title>
</head>

<body>

    <h1>Overcrowded Tank</h1>

    <button onclick="showMessage()">
        Click Me
    </button>

    <p id="message"></p>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Let's raise awareness about the effects of overcrowding on fish populations and how it can harm their environment and health. When too many fish are placed in one tank, they may experience stress, compete for food and oxygen, and become more vulnerable to diseases. That's why we should practice responsible fish farming and provide every fish with enough space to thrive.";
        }
    </script>

</body>
</html>
